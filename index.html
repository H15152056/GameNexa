<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
         DEFAULT / FALLBACK SEO TAGS
         These are overwritten per-page at runtime by src/SEO.jsx,
         and overwritten again at build time (per real URL) by
         scripts/generate-seo.js for crawlers/social bots that don't
         run JavaScript. Keep these in sync with src/seoConfig.js.
         ============================================================ -->

    <title>GameNexa — Gaming News, Guides & Character Databases</title>
    <meta
      name="description"
      content="GameNexa brings gaming news, updates, guides, character databases and useful information for your favorite games."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#030807" />
    <link rel="canonical" href="https://gamenexa.gamenexa.workers.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GameNexa" />
    <meta property="og:title" content="GameNexa — Gaming News, Guides & Character Databases" />
    <meta
      property="og:description"
      content="GameNexa brings gaming news, updates, guides, character databases and useful information for your favorite games."
    />
    <meta property="og:url" content="https://gamenexa.gamenexa.workers.dev/" />
    <meta property="og:image" content="https://gamenexa.gamenexa.workers.dev/og-default.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@gamenexa" />
    <meta name="twitter:title" content="GameNexa — Gaming News, Guides & Character Databases" />
    <meta
      name="twitter:description"
      content="GameNexa brings gaming news, updates, guides, character databases and useful information for your favorite games."
    />
    <meta name="twitter:image" content="https://gamenexa.gamenexa.workers.dev/og-default.png" />

    <!-- Favicons / icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Default JSON-LD (WebSite) â€” page-specific JSON-LD is injected by src/SEO.jsx
         at runtime and by scripts/generate-seo.js at build time. -->
    <script type="application/ld+json" id="default-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "GameNexa",
        "url": "https://gamenexa.gamenexa.workers.dev/",
        "description": "GameNexa brings gaming news, updates, guides, character databases and useful information for your favorite games."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
